# dsh-context-diet bundle patch.
#
# ONE PLAIN INSERT ROW, ON PURPOSE.
#
# `dsh-market` can activate an installed or updated plugin in the live process
# without a restart — `hotMount()` in `dshmarket/lib/hot.js` imports the package
# and mounts it into the running tree. It can only do that when this file parses
# as plain `- insert:` / `id:` / `name:` rows; its `parseSimplePatch()` returns
# null on ANY other line (a `config:` block, a disable row, an expression) and
# the market then falls back to "restart required".
#
# So every knob lives in `lib/index.js` as its shipped default, and nothing is
# restated here. That is not a loss: the values below ARE those defaults, and
# restating them was actively harmful — an explicit `noFoldForTools` list
# REPLACES the built-in one instead of extending it, which silently un-protected
# the billion-context tools (`decompress`, `compress`, `absorb`, …) whose output
# must stay byte-exact.
#
# Need a non-default value? Add a `config:` block yourself — in your profile's
# own `cordis.patch.yml`, which is where local overrides belong. Doing it here
# is what costs you hot activation.
#
# Shipped defaults, for reference (all from lib/index.js):
#
#   enabled: true
#   minChars: 1000            # measured elbow: 4000 reshapes 16.5% of tool
#                             # bytes, 1000 reshapes 29.0%, 600 only 29.2%
#   minSavingRatio: 0.08      # a reduction below this fraction is discarded
#   minSavedChars: 400        # …and below this absolute count, which is what
#                             # pays for the retrieval marker
#   markerStyle: full         # 'full' prints the ctx_restore id in the marker
#   includeErrors: false
#   excludeTools: []
#   noFoldForTools: read, write, edit, str_replace_editor, apply_patch,
#                   ctx_restore, ctx_stats, ctx_audit, decompress,
#                   acp_retrieve, acp_read_original_image, acp_status,
#                   acp_cache, compress, absorb
#   noFoldForPatterns: *.rs *.c *.h *.cpp *.hpp *.js *.ts *.json *.yml *.yaml *.toml
#   codeSkeleton: { enabled: true, minLines: 60, maxLines: 1200,
#                   documentDumps: fold }   # fold | protect | off
#   ccr:          { enabled: true, persist: true, ttlMs: 86400000,
#                   maxEntries: 2000 }
#   history:      { enabled: false, strategy: auto, cacheType: auto,
#                   protectionFloor: 0.45, protectRecentMessages: 6,
#                   protectHeadMessages: 2, maxRewrites: 200 }
#   audit:        { contextWindow: 512000, window: 40,
#                   prices: { inputPerM: 1, cachedInputPerM: 0.02, outputPerM: 4 } }
- insert:
    - id: dsh-context-diet
      name: dsh-context-diet
